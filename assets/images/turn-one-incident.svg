<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Poppins, Arial, sans-serif">
  <!-- Original StoryCast schematic of the first-corner incidents. Simplified; not a reconstruction of exact car positions. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B00000"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#F4F4F4"/>
  <path d="M -20 345 L 300 345 C 470 345, 540 290, 560 30" fill="none" stroke="#333333" stroke-width="130"/>
  <path d="M -20 345 L 300 345 C 470 345, 540 290, 560 30" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="12 12" stroke-opacity="0.5"/>
  <text x="380" y="140" fill="#15151E" font-size="18" font-weight="700" letter-spacing="2">TURN 1</text>
  <text x="16" y="250" fill="#15151E" font-size="13" font-weight="600">Direction of travel</text>
  <line x1="16" y1="264" x2="140" y2="264" stroke="#15151E" stroke-width="2"/>
  <path d="M 132 258 L 142 264 L 132 270" fill="none" stroke="#15151E" stroke-width="2"/>
  <text x="16" y="28" fill="#333333" font-size="12" letter-spacing="1">SCHEMATIC — NOT TO SCALE</text>

  <g stroke="#B00000" stroke-width="4" marker-end="url(#arrow)">
    <line x1="290.6" y1="356.2" x2="319.4" y2="368.8"/>
    <line x1="367.6" y1="363.4" x2="397.4" y2="341.6"/>
    <line x1="291.2" y1="335.1" x2="323.8" y2="322.9"/>
    <line x1="98" y1="345" x2="142" y2="345"/>
  </g>

  <g stroke="#15151E" stroke-width="3" fill="#FFFFFF">
    <circle cx="265" cy="345" r="24"/>
    <circle cx="345" cy="380" r="24"/>
    <circle cx="420" cy="325" r="24"/>
    <circle cx="350" cy="313" r="24"/>
    <circle cx="70" cy="345" r="24"/>
    <circle cx="170" cy="345" r="24"/>
  </g>
  <g fill="#15151E" font-size="13" font-weight="700" text-anchor="middle">
    <text x="265" y="350">BOT</text>
    <text x="345" y="385">NOR</text>
    <text x="420" y="330">VER</text>
    <text x="350" y="318">PER</text>
    <text x="70" y="350">STR</text>
    <text x="170" y="350">LEC</text>
  </g>
</svg>
