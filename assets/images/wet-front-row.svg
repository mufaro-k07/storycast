<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Poppins, Arial, sans-serif">
  <!-- Original StoryCast schematic: wet front row heading for Turn 1. Not to scale. -->
  <rect width="600" height="400" fill="#15151E"/>
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="30" x2="22" y2="70"/>
    <line x1="130" y1="60" x2="112" y2="100"/>
    <line x1="220" y1="20" x2="202" y2="60"/>
    <line x1="470" y1="40" x2="452" y2="80"/>
    <line x1="560" y1="90" x2="542" y2="130"/>
    <line x1="80" y1="250" x2="62" y2="290"/>
    <line x1="540" y1="260" x2="522" y2="300"/>
    <line x1="500" y1="340" x2="482" y2="380"/>
    <line x1="60" y1="350" x2="42" y2="390"/>
  </g>
  <rect x="150" y="0" width="300" height="400" fill="#333333"/>
  <line x1="150" y1="250" x2="450" y2="250" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="180" y="270" width="80" height="56" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="340" y="300" width="80" height="56" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="192" y="280" width="56" height="36" fill="#E10600"/>
  <rect x="352" y="310" width="56" height="36" fill="#FFFFFF"/>
  <text x="220" y="304" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">P1</text>
  <text x="380" y="334" fill="#15151E" font-size="15" font-weight="700" text-anchor="middle">P2</text>
  <path d="M 300 230 L 300 70" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 288 84 L 300 64 L 312 84" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <text x="300" y="44" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">TO TURN 1</text>
  <text x="16" y="388" fill="#FFFFFF" font-size="12" letter-spacing="1">SCHEMATIC — NOT TO SCALE</text>
</svg>
